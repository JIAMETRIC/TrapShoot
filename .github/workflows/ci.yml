name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures-current:
    name: Golden fixtures match the JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node Tools/golden/generate.js TrapShooterPro/Web/index.html Packages/TrapCore/Tests/TrapCoreTests/Fixtures
      - run: git diff --exit-code -- Packages/TrapCore/Tests/TrapCoreTests/Fixtures

  packages-macos:
    name: swift test (TrapCore, TrapData, TrapWeather)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - run: swift --version
      - name: TrapCore
        shell: bash
        run: swift test --package-path Packages/TrapCore --parallel 2>&1 | tee "$RUNNER_TEMP/TrapCore.log"
      - name: TrapData
        shell: bash
        run: swift test --package-path Packages/TrapData 2>&1 | tee "$RUNNER_TEMP/TrapData.log"
      - name: TrapWeather
        shell: bash
        run: swift test --package-path Packages/TrapWeather 2>&1 | tee "$RUNNER_TEMP/TrapWeather.log"
      # Annotations are readable without signing in, unlike job logs; repeat the failing lines there.
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          lines=$(grep -hE "error:|failed|Fatal error" "$RUNNER_TEMP"/*.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=swift test failures::${lines:-no error lines found}"

  ios:
    name: iOS build and simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: App builds (hybrid shell until the native target lands)
        run: |
          xcodebuild -project TrapShooterPro.xcodeproj -scheme TrapShooterPro \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/App.log" | xcpretty || exit ${PIPESTATUS[0]}
      - name: TrapPlatform tests (iOS only package)
        run: |
          cd Packages/TrapPlatform
          xcodebuild -scheme TrapPlatform -destination 'platform=iOS Simulator,name=iPhone 16' test | xcpretty || exit ${PIPESTATUS[0]}
      - name: ShotTimer tests (iOS only package)
        run: |
          cd Packages/ShotTimer
          xcodebuild -scheme ShotTimer -destination 'platform=iOS Simulator,name=iPhone 16' test | tee "$RUNNER_TEMP/ShotTimer.log" | xcpretty || exit ${PIPESTATUS[0]}
      - name: TrapReports tests (iOS only package)
        run: |
          cd Packages/TrapReports
          xcodebuild -scheme TrapReports -destination 'platform=iOS Simulator,name=iPhone 16' test | tee "$RUNNER_TEMP/TrapReports.log" | xcpretty || exit ${PIPESTATUS[0]}
      - name: ShotTimer and TrapDesign build
        run: |
          (cd Packages/ShotTimer && xcodebuild -scheme ShotTimer -destination 'generic/platform=iOS Simulator' build | xcpretty || exit ${PIPESTATUS[0]})
          (cd Packages/TrapDesign && xcodebuild -scheme TrapDesign -destination 'generic/platform=iOS Simulator' build | xcpretty || exit ${PIPESTATUS[0]})
      - name: Annotate simulator test failures
        if: failure()
        shell: bash
        run: |
          lines=$(grep -hE "error:|failed|Fatal error" "$RUNNER_TEMP"/*.log 2>/dev/null | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=simulator test failures::${lines:-no error lines found}"
